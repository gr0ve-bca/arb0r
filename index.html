<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arb0r</title>
    <meta name="description" content="arb0r — gr0ve's visual asset library">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        /* ─── Design tokens — mirrored from the gr0ve dashboard ─── */
        :root {
            --scaffold: #111111;
            --surface: #1A1A1A;
            --elevated: #262626;
            --on-surface: #FFFFFF;
            --on-surface-v: #9AA0A6;
            --on-surface-mid: rgba(255, 255, 255, 0.45);
            --on-surface-dim: rgba(255, 255, 255, 0.32);
            --outline: #3A3A3A;
            --outline-faint: rgba(58, 58, 58, 0.16);
            --outline-subtle: rgba(58, 58, 58, 0.3);
            --primary: #35B595;
            --primary-on: #FFFFFF;
            --primary-10: rgba(53, 181, 149, 0.10);
            --primary-15: rgba(53, 181, 149, 0.15);
            --primary-50: rgba(53, 181, 149, 0.50);
            --primary-80: rgba(53, 181, 149, 0.80);
            --error: #FF8A8A;
            --error-15: rgba(255, 138, 138, 0.15);
            --font-mono: 'JetBrains Mono', monospace;
            --font-body: 'Manrope', sans-serif;
            --glow: rgba(31, 111, 91, 0.16);
            --tile-shadow: 0 10px 24px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.04);
            --tile-shadow-hover: 0 16px 36px rgba(0, 0, 0, 0.11), 0 3px 8px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            background: var(--scaffold);
            color: var(--on-surface);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            min-height: 100%;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--elevated);
            border-radius: 4px;
        }

        ::placeholder {
            color: var(--on-surface-v);
        }

        .wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: clamp(20px, 4vw, 44px) clamp(16px, 4vw, 36px) 60px;
            background: radial-gradient(ellipse 800px 300px at 50% -40px, var(--glow) 0%, transparent 70%);
        }

        /* ─── Header ─── */
        header {
            margin-bottom: 28px;
            text-align: center;
        }

        .eyebrow {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--primary-50);
            margin-bottom: 6px;
        }

        h1 {
            font-family: var(--font-mono);
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-50) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 18px;
        }

        .search-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-inp {
            flex: 1 1 260px;
            background: var(--surface);
            border: 1px solid var(--outline-faint);
            border-radius: 16px;
            padding: 13px 16px;
            color: var(--on-surface);
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            transition: box-shadow .2s, border-color .2s;
        }

        .search-inp:focus {
            box-shadow: 0 0 0 1.5px var(--primary);
            border-color: var(--primary);
        }

        .mode-toggle {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--outline-faint);
            border-radius: 20px;
            padding: 3px;
            flex-shrink: 0;
        }

        .mode-btn {
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: .8px;
            text-transform: uppercase;
            color: var(--on-surface-v);
            background: transparent;
            border: none;
            border-radius: 16px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all .15s ease;
        }

        .mode-btn:hover {
            color: var(--on-surface);
        }

        .mode-btn.active {
            background: var(--primary);
            color: var(--primary-on);
        }

        .count-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .5px;
            color: var(--primary);
            background: var(--primary-10);
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .folder-pills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .pill-btn {
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .5px;
            color: var(--on-surface-v);
            background: var(--surface);
            border: 1px solid var(--outline-faint);
            border-radius: 20px;
            padding: 6px 13px;
            cursor: pointer;
            transition: all .15s ease;
        }

        .pill-btn:hover {
            border-color: var(--primary-50);
            color: var(--on-surface);
        }

        .pill-btn.active {
            background: var(--primary-15);
            color: var(--primary);
            border-color: var(--primary-50);
        }

        /* ─── State messages ─── */
        .state-msg {
            font-family: var(--font-body);
            font-size: 13px;
            color: var(--on-surface-v);
            text-align: center;
            padding: 60px 20px;
        }

        .state-msg.error {
            color: var(--error);
        }

        /* ─── Grid ─── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }

        .card {
            background: linear-gradient(155deg, var(--surface) 0%, var(--elevated) 145%);
            border: 1px solid var(--outline-faint);
            border-radius: 18px;
            box-shadow: var(--tile-shadow);
            padding: 10px;
            cursor: pointer;
            transition: box-shadow .2s, transform .2s, border-color .2s;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card:hover {
            box-shadow: var(--tile-shadow-hover);
            border-color: var(--outline-subtle);
            transform: translateY(-2px);
        }

        .card-thumb {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            background: var(--scaffold);
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, .03) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255, 255, 255, .03) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, .03) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, .03) 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .card-name {
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 600;
            color: var(--on-surface-v);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 2px;
        }

        /* ─── Modal ─── */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s;
            z-index: 800;
        }

        .modal-bg.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.96);
            width: 480px;
            max-width: 92vw;
            max-height: 88vh;
            overflow-y: auto;
            background: linear-gradient(165deg, var(--surface) 0%, var(--elevated) 150%);
            border-radius: 26px;
            border: 1px solid var(--outline-faint);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .4);
            padding: 28px;
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: all .25s cubic-bezier(.16, 1, .3, 1);
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 28px;
            height: 28px;
            border: none;
            background: var(--elevated);
            border-radius: 8px;
            cursor: pointer;
            color: var(--on-surface-v);
            font-size: 13px;
            font-weight: 700;
        }

        .modal-close:hover {
            background: var(--error-15);
            color: var(--error);
        }

        .modal-preview {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            background: var(--scaffold);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .modal-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .modal-name {
            font-family: var(--font-mono);
            font-size: 15px;
            font-weight: 700;
            color: var(--on-surface);
            word-break: break-all;
            margin-bottom: 4px;
        }

        .modal-path {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--on-surface-dim);
            margin-bottom: 18px;
        }

        .modal-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--primary);
            color: var(--primary-on);
            border: none;
            border-radius: 14px;
            padding: 13px;
            font-family: var(--font-body);
            font-size: 13.5px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: filter .2s;
        }

        .modal-download:hover {
            filter: brightness(1.08);
        }

        .modal-attribution {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 14px;
            background: var(--primary-10);
            border: 1px solid var(--outline-faint);
            font-family: var(--font-body);
            font-size: 12px;
            line-height: 1.55;
            color: var(--on-surface-v);
        }

        .modal-attribution strong {
            color: var(--on-surface);
        }

        @media (max-width: 520px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="wrap">
        <header>
            <p class="eyebrow">gr0ve's asset library</p>
            <h1>arb0r</h1>
            <div class="search-row">
                <input class="search-inp" id="searchInp" type="text" placeholder="Search assets by filename…">
                <div class="mode-toggle" id="modeToggle">
                    <button class="mode-btn active" data-mode="dark">Dark</button>
                    <button class="mode-btn" data-mode="light">Light</button>
                </div>
                <span class="count-badge" id="countBadge">loading…</span>
            </div>
            <div class="folder-pills" id="folderPills"></div>
        </header>

        <main id="grid" class="grid"></main>
    </div>

    <!-- ── Detail modal ── -->
    <div class="modal-bg" id="modalBg"></div>
    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">✕</button>
        <div class="modal-preview" id="modalPreview"></div>
        <p class="modal-name" id="modalName"></p>
        <p class="modal-path" id="modalPath"></p>
        <a class="modal-download" id="modalDownload" download>Download</a>
        <div class="modal-attribution">
            <strong>Attribution required.</strong> Free to use, but every use must carry visible credit to
            "Arjun Yuvaraj", "gr0ve", or "arb0r" placed near the asset itself and legible to your audience.
        </div>
    </div>

    <script>
        'use strict';

        /* ══ Config — update these to point at your repo ══ */
        const GITHUB_OWNER = 'gr0ve-bca';
        const GITHUB_REPO = 'arb0r';
        const GITHUB_BRANCH = 'main';

        const IMG_EXTS = new Set(['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'ico', 'avif']);

        let allAssets = [];
        let activeFolder = 'all';
        let activeMode = 'dark';

        function extOf(path) {
            const i = path.lastIndexOf('.');
            return i === -1 ? '' : path.slice(i + 1).toLowerCase();
        }

        // Only _dark / _light suffixed files count as browsable assets — anything
        // else (a stray icon with no variant suffix) is left out entirely rather
        // than shown unfiltered.
        function variantOf(filename) {
            const stem = filename.slice(0, filename.lastIndexOf('.')) || filename;
            if (/_dark$/i.test(stem)) return 'dark';
            if (/_light$/i.test(stem)) return 'light';
            return null;
        }

        function cdnUrl(path) {
            return `https://cdn.jsdelivr.net/gh/${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}/${path}`;
        }

        function rawUrl(path) {
            return `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}`;
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        async function loadAssets() {
            const countBadge = document.getElementById('countBadge');
            try {
                const res = await fetch(
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`
                );
                if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
                const data = await res.json();
                const tree = Array.isArray(data.tree) ? data.tree : [];

                allAssets = tree
                    .filter(item => item.type === 'blob' && IMG_EXTS.has(extOf(item.path)))
                    .map(item => {
                        const parts = item.path.split('/');
                        const name = parts[parts.length - 1];
                        const folder = parts.length > 1 ? parts[0] : '';
                        return { path: item.path, name, folder, variant: variantOf(name) };
                    })
                    .filter(a => a.variant) // only _dark / _light files are shown
                    .sort((a, b) => a.path.localeCompare(b.path));

                if (!allAssets.length) {
                    document.getElementById('grid').innerHTML =
                        `<p class="state-msg">No _dark or _light assets found in this repo yet.</p>`;
                    countBadge.textContent = '0 assets';
                    return;
                }

                renderFolderPills();
                renderGrid();
            } catch (err) {
                console.error(err);
                countBadge.textContent = 'error';
                document.getElementById('grid').innerHTML =
                    `<p class="state-msg error">Couldn't load assets from GitHub (${escapeHtml(err.message)}).<br>
           Check that GITHUB_OWNER / GITHUB_REPO in index.html are correct, or try again in a bit
           (the public API is rate-limited).</p>`;
            }
        }

        function renderFolderPills() {
            const el = document.getElementById('folderPills');
            const inMode = allAssets.filter(a => a.variant === activeMode);
            const folders = [...new Set(inMode.map(a => a.folder).filter(Boolean))].sort();
            if (activeFolder !== 'all' && !folders.includes(activeFolder)) activeFolder = 'all';
            if (!folders.length) { el.innerHTML = ''; return; }

            const pills = [{ key: 'all', label: 'All' }, ...folders.map(f => ({ key: f, label: f }))];
            el.innerHTML = pills.map(p => `
        <button class="pill-btn ${p.key === activeFolder ? 'active' : ''}" data-folder="${escapeHtml(p.key)}">
          ${escapeHtml(p.label)}
        </button>
      `).join('');

            el.querySelectorAll('.pill-btn').forEach(btn => {
                btn.onclick = () => {
                    activeFolder = btn.dataset.folder;
                    el.querySelectorAll('.pill-btn').forEach(b => b.classList.toggle('active', b === btn));
                    renderGrid();
                };
            });
        }

        function renderGrid() {
            const q = document.getElementById('searchInp').value.trim().toLowerCase();
            const grid = document.getElementById('grid');

            const filtered = allAssets.filter(a => {
                const matchesMode = a.variant === activeMode;
                const matchesFolder = activeFolder === 'all' || a.folder === activeFolder;
                const matchesQuery = !q || a.path.toLowerCase().includes(q);
                return matchesMode && matchesFolder && matchesQuery;
            });

            const countBadge = document.getElementById('countBadge');
            countBadge.textContent = `${filtered.length} asset${filtered.length !== 1 ? 's' : ''}`;

            if (!filtered.length) {
                grid.innerHTML = q
                    ? `<p class="state-msg">No assets match "${escapeHtml(q)}".</p>`
                    : `<p class="state-msg">No ${activeMode} assets here.</p>`;
                return;
            }

            grid.innerHTML = filtered.map((a, i) => `
        <div class="card" data-idx="${i}" data-path="${escapeHtml(a.path)}">
          <div class="card-thumb"><img src="${escapeHtml(cdnUrl(a.path))}" alt="${escapeHtml(a.name)}" loading="lazy"></div>
          <div class="card-name">${escapeHtml(a.name)}</div>
        </div>
      `).join('');

            grid.querySelectorAll('.card').forEach((card, i) => {
                card.onclick = () => openModal(filtered[i]);
            });
        }

        document.getElementById('searchInp').addEventListener('input', renderGrid);

        document.getElementById('modeToggle').addEventListener('click', e => {
            const btn = e.target.closest('.mode-btn');
            if (!btn || btn.classList.contains('active')) return;
            activeMode = btn.dataset.mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
            activeFolder = 'all';
            renderFolderPills();
            renderGrid();
        });

        /* ── Modal ── */
        const modalBg = document.getElementById('modalBg');
        const modal = document.getElementById('modal');

        function openModal(asset) {
            document.getElementById('modalPreview').innerHTML =
                `<img src="${escapeHtml(cdnUrl(asset.path))}" alt="${escapeHtml(asset.name)}">`;
            document.getElementById('modalName').textContent = asset.name;
            document.getElementById('modalPath').textContent = asset.path;
            const dl = document.getElementById('modalDownload');
            dl.href = rawUrl(asset.path);
            dl.setAttribute('download', asset.name);
            modalBg.classList.add('open');
            modal.classList.add('open');
        }

        function closeModal() {
            modalBg.classList.remove('open');
            modal.classList.remove('open');
        }

        document.getElementById('modalClose').onclick = closeModal;
        modalBg.onclick = closeModal;
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        loadAssets();
    </script>
</body>

</html>
